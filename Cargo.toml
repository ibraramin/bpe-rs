[package]
name = "byte-bpe"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "A small, dependency-free byte-level BPE tokenizer"
repository = "https://github.com/ibraramin/bpe-rs"
readme = "README.md"
keywords = ["tokenizer", "bpe", "nlp"]
categories = ["text-processing", "science"]

[features]
# Opt-in only: with default features `encode` keeps the original single-threaded path.
default = []
# Provisional SIMD candidate for the pre-registered falsification experiment (2b-A2).
simd = []

[dev-dependencies]
criterion = "0.5"
proptest = "1"
tokenizers = "0.21"

[[bench]]
name = "bpe_bench"
harness = false
